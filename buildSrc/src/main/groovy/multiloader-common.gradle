plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_name}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

repositories {
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

ext.mavenDependencyWhitelist = []

def resolveMavenDependencyWhitelist = {
    def rawWhitelist = project.ext.mavenDependencyWhitelist
    def rawValues = []

    if (rawWhitelist instanceof CharSequence) {
        rawValues << rawWhitelist.toString()
    } else if (rawWhitelist instanceof Iterable) {
        rawWhitelist.each { value ->
            if (value != null) {
                rawValues << value.toString()
            }
        }
    } else if (rawWhitelist != null) {
        rawValues << rawWhitelist.toString()
    }

    rawValues
            .collect { it.trim() }
            .findAll { !it.isEmpty() }
            .toSet()
}

ext.applyPomDependencyWhitelist = { MavenPublication publication ->
    publication.pom.withXml {
        def whiteList = resolveMavenDependencyWhitelist()
        def isAllowed = { String groupId, String artifactId ->
            def coordinate = "${groupId}:${artifactId}".toString()
            whiteList.contains(groupId) ||
                    whiteList.contains(artifactId) ||
                    whiteList.contains(coordinate)
        }

        def dependenciesNode = asNode().getAt('dependencies')?.getAt(0)
        if (dependenciesNode != null) {
            def dependencies = dependenciesNode.children().findAll { it instanceof Node }
            def toRemove = dependencies.findAll { Node dep ->
                def groupId = (dep.groupId?.text() ?: '').trim()
                def artifactId = (dep.artifactId?.text() ?: '').trim()
                !isAllowed(groupId, artifactId)
            }
            toRemove.each { dependenciesNode.remove(it) }
        }

        def declaredDependencies = [:]
        [
                [name: 'api', scope: 'compile'],
                [name: 'implementation', scope: 'runtime'],
                [name: 'runtimeOnly', scope: 'runtime'],
                [name: 'compileOnly', scope: 'compile']
        ].each { configInfo ->
            def configuration = configurations.findByName(configInfo.name)
            configuration?.dependencies
                    ?.withType(org.gradle.api.artifacts.ExternalModuleDependency)
                    ?.each { dep ->
                        def groupId = (dep.group ?: '').trim()
                        def artifactId = (dep.name ?: '').trim()
                        def version = dep.version?.toString()?.trim()
                        if (!groupId || !artifactId || !version || !isAllowed(groupId, artifactId)) {
                            return
                        }

                        def coordinate = "${groupId}:${artifactId}".toString()
                        if (!declaredDependencies.containsKey(coordinate) || configInfo.scope == 'compile') {
                            declaredDependencies[coordinate] = [
                                    groupId   : groupId,
                                    artifactId: artifactId,
                                    version   : version,
                                    scope     : configInfo.scope
                            ]
                        }
                    }
        }

        if (dependenciesNode == null && !declaredDependencies.isEmpty()) {
            dependenciesNode = asNode().appendNode('dependencies')
        }

        if (dependenciesNode != null) {
            def existingCoordinates = dependenciesNode.children()
                    .findAll { it instanceof Node }
                    .collect { Node dep ->
                        def groupId = (dep.groupId?.text() ?: '').trim()
                        def artifactId = (dep.artifactId?.text() ?: '').trim()
                        "${groupId}:${artifactId}".toString()
                    }
                    .toSet()

            declaredDependencies.each { coordinate, depInfo ->
                if (!existingCoordinates.contains(coordinate)) {
                    def depNode = dependenciesNode.appendNode('dependency')
                    depNode.appendNode('groupId', depInfo.groupId)
                    depNode.appendNode('artifactId', depInfo.artifactId)
                    depNode.appendNode('version', depInfo.version)
                    depNode.appendNode('scope', depInfo.scope)
                }
            }
        }

        if (dependenciesNode != null && dependenciesNode.children().isEmpty()) {
            asNode().remove(dependenciesNode)
        }
    }
}

publishing {
    repositories {
        def localMavenUrl = System.getenv('local_maven_url')
        if (localMavenUrl) {
            maven {
                url uri(localMavenUrl)
            }
        }
    }
}
