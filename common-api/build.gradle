architectury {
    common rootProject.enabled_platforms.split(',')
}


loom {
    accessWidenerPath = file("src/main/resources/oelib.accesswidener")
}

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(remapJar) {
                builtBy tasks.remapJar
                classifier null
            }
            artifact(tasks.sourcesJar) {
                classifier "sources"
            }
            pom.withXml {
                def root = asNode()
                def depsNode = root.appendNode('dependencies')
                def addDeps = { confName, scope ->
                    def conf = configurations.findByName(confName)
                    if (conf != null) {
                        conf.allDependencies.each { dep ->
                            if (!(dep instanceof ProjectDependency) && dep.group && dep.name && dep.version) {
                                def dn = depsNode.appendNode('dependency')
                                dn.appendNode('groupId', dep.group)
                                dn.appendNode('artifactId', dep.name)
                                dn.appendNode('version', dep.version)
                                dn.appendNode('scope', scope)
                                logger.lifecycle("POM add dependency ${dep.group}:${dep.name}:${dep.version} (${scope})")
                            }
                        }
                    }
                }
                addDeps('api', 'compile')
                addDeps('implementation', 'runtime')
            }
        }
    }
}
