plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    compileOnly "cn.6tail:lunar:1.7.3"
    compileOnly "de.marhali:json5-java:3.0.0"
    compileOnly "org.mvel:mvel2:2.5.0.Final"
    compileOnly "com.electronwill.night-config:toml:3.8.3"
    testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
    testImplementation files(sourceSets.main.compileClasspath)
}

// Allow by `group`, `artifact`, or full `group:artifact`.
// Add an item here to keep that dependency in the published POM.
mavenDependencyWhitelist = [
        'org.spongepowered:mixin',
        'io.github.llamalad7:mixinextras-common'
]

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
    testImplementation.extendsFrom compileOnly
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// -----------------------------------------------------------------------------
// JMH source set + tasks
// -----------------------------------------------------------------------------
// Usage:
// - Quick run: `./gradlew :common:jmhQuick`
// - Stable run:`./gradlew :common:jmh`
// - Filter:    `./gradlew :common:jmhQuick -PjmhInclude=RecordCodec`
// - Extra args `./gradlew :common:jmhQuick -PjmhArgs="-prof gc"`

sourceSets {
    jmh {
        java.srcDir 'src/jmh/java'
        resources.srcDir 'src/jmh/resources'

        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + compileClasspath + configurations.runtimeClasspath
    }
}

configurations {
    jmhImplementation.extendsFrom implementation
    jmhRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // --- JMH (microbenchmarks) ---
    // Kept intentionally lightweight so a quick run finishes fast (< 1 min).
    def jmhVersion = '1.37'
    jmhImplementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    jmhAnnotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
}

tasks.register('jmhQuick', JavaExec) {
    group = 'benchmark'
    description = 'Run JMH benchmarks (quick defaults)'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    dependsOn tasks.named('jmhClasses')

    // Defaults are tuned for short feedback loops.
    // Override via -PjmhArgs or -PjmhInclude if you need more.
    args '-wi', '2',
            '-i', '3',
            '-f', '1',
            '-w', '300ms',
            '-r', '300ms',
            '-tu', 'ns'

    if (project.hasProperty('jmhInclude')) {
        args project.property('jmhInclude').toString()
    }
    if (project.hasProperty('jmhArgs')) {
        project.property('jmhArgs')
                .toString()
                .trim()
                .split(/\s+/)
                .findAll { !it.isBlank() }
                .each { args it }
    }
}

def configureJmhArgs = { JavaExec execTask ->
    if (project.hasProperty('jmhInclude')) {
        execTask.args project.property('jmhInclude').toString()
    }
    if (project.hasProperty('jmhArgs')) {
        project.property('jmhArgs')
                .toString()
                .trim()
                .split(/\s+/)
                .findAll { !it.isBlank() }
                .each { execTask.args it }
    }
}

tasks.register('jmh', JavaExec) {
    group = 'benchmark'
    description = 'Run JMH benchmarks (more stable defaults)'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    dependsOn tasks.named('jmhClasses')

    // More stable defaults: still "not hours", but much less noisy.
    // Rough estimate with current benchmark count: a few minutes.
    args '-wi', '5',
            '-i', '5',
            '-f', '2',
            '-w', '1s',
            '-r', '1s',
            '-tu', 'ns'

    configureJmhArgs(delegate as JavaExec)
}

tasks.register('jmhGc', JavaExec) {
    group = 'benchmark'
    description = 'Run JMH benchmarks with -prof gc (stable defaults)'
    classpath = sourceSets.jmh.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    dependsOn tasks.named('jmhClasses')

    args '-wi', '5',
            '-i', '5',
            '-f', '2',
            '-w', '1s',
            '-r', '1s',
            '-tu', 'ns',
            '-prof', 'gc'

    configureJmhArgs(delegate as JavaExec)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('processJmhResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

publishing {
    repositories {
        def modVersion = project.version ?: 'unknown'
        boolean isSnapshot = modVersion.toLowerCase().contains('snapshot')
        def publishUrl = isSnapshot ?
                "https://maven.sighs.cc/repository/maven-snapshots/" :
                "https://maven.sighs.cc/repository/maven-releases/"

        maven {
            name = "remoteRepo"
            url = uri(publishUrl)
            credentials {
                username = System.getenv("SIGHS_PUBLISH_USER")
                password = System.getenv("SIGHS_PUBLISH_PASSWORD")
            }
        }
    }

    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = base.archivesName.get()
            version = project.version
            applyPomDependencyWhitelist(delegate as MavenPublication)
        }
    }
}
