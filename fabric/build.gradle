plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common-api").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
}

repositories {
    maven {
        name = "Terraformers"
        url = "https://maven.terraformersmc.com/"
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation("com.terraformersmc:modmenu:${rootProject.modmenu_version}")
    modImplementation("mezz.jei:jei-$rootProject.minecraft_version-fabric:${jei_version}")

    implementation "cn.6tail:lunar:1.7.3"
    implementation "com.electronwill.night-config:toml:3.8.3"
    implementation "de.marhali:json5-java:3.0.0"
    include("cn.6tail:lunar:1.7.3")
    include("com.electronwill.night-config:toml:3.8.3")
    include("de.marhali:json5-java:3.0.0")

    common(project(path: ':common-api', configuration: 'namedElements')) { transitive false }
    shadowCommon (project(path: ':common-api', configuration: 'transformProductionFabric')) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

java {
    withSourcesJar()
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

publishing {
    publications {
        mavenFabric(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(remapJar) {
                builtBy tasks.remapJar
                classifier null
            }
            artifact(tasks.sourcesJar) {
                classifier "sources"
            }
            pom.withXml {
                def root = asNode()
                def depsNode = root.appendNode('dependencies')
                def addDeps = { confName, scope ->
                    def conf = configurations.findByName(confName)
                    if (conf != null) {
                        conf.allDependencies.each { dep ->
                            if (!(dep instanceof ProjectDependency) && dep.group && dep.name && dep.version) {
                                def dn = depsNode.appendNode('dependency')
                                dn.appendNode('groupId', dep.group)
                                dn.appendNode('artifactId', dep.name)
                                dn.appendNode('version', dep.version)
                                dn.appendNode('scope', scope)
                                logger.lifecycle("POM add dependency ${dep.group}:${dep.name}:${dep.version} (${scope})")
                            }
                        }
                    }
                }
                addDeps('api', 'compile')
                addDeps('implementation', 'runtime')
            }
        }
    }
}
