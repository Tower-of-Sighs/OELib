import net.fabricmc.loom.task.RemapJarTask

plugins {
    id 'com.github.johnrengelman.shadow'
}

loom {
    forge {
        mixinConfig "oelib.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modImplementation "dev.architectury:architectury-forge:$rootProject.architectury_api_version"
    common(project(path: ':common-api', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common-api', configuration: 'transformProductionForge')
    implementation(include("org.mvel:mvel2:2.5.0.Final"))
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}

tasks.register("plainJar", Jar) {
    from sourceSets.main.output
    archiveClassifier = 'dev'
}

tasks.register("remapPlainJar", RemapJarTask) {
    dependsOn tasks.named("plainJar")
    input.set tasks.named("plainJar").get().archiveFile
    archiveClassifier.set("dev-noshadow")
}

// 此开发环境运行时无法识别 MVEL，很神秘
tasks.named("runClient") {
    systemProperty "oelib.skipExpressionEngine", "true"
}
