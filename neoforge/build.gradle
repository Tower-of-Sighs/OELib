plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common-api").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"

    modImplementation("mezz.jei:jei-$rootProject.minecraft_version-neoforge:${jei_version}")

    include("cn.6tail:lunar:1.7.3")
    include("de.marhali:json5-java:3.0.0")

    implementation "cn.6tail:lunar:1.7.3"
    implementation "de.marhali:json5-java:3.0.0"
    modLocalRuntime("cn.6tail:lunar:1.7.3")
    modLocalRuntime("de.marhali:json5-java:3.0.0")
    forgeRuntimeLibrary("cn.6tail:lunar:1.7.3")
    forgeRuntimeLibrary("de.marhali:json5-java:3.0.0")

    common(project(path: ':common-api', configuration: 'namedElements')) { transitive false }
    shadowCommon (project(path: ':common-api', configuration: 'transformProductionNeoForge')) { transitive false }
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "oelib.accessWidener"
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

sourcesJar {
    afterEvaluate {
        [":common-api"].forEach {
            def depSources = project(it).sourcesJar
            dependsOn depSources
            from(depSources.archiveFile.map { zipTree(it) }) {
                exclude "oelib.accessWidener"
            }
        }
    }
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = base.archivesName.get()
            artifact(remapJar) {
                builtBy tasks.remapJar
                classifier null
            }
            artifact(tasks.sourcesJar) {
                classifier "sources"
            }
            pom.withXml {
                def root = asNode()
                def depsNode = root.appendNode('dependencies')
                def addDeps = { confName, scope ->
                    def conf = configurations.findByName(confName)
                    if (conf != null) {
                        conf.allDependencies.each { dep ->
                            if (!(dep instanceof ProjectDependency) && dep.group && dep.name && dep.version) {
                                def dn = depsNode.appendNode('dependency')
                                dn.appendNode('groupId', dep.group)
                                dn.appendNode('artifactId', dep.name)
                                dn.appendNode('version', dep.version)
                                dn.appendNode('scope', scope)
                                logger.lifecycle("POM add dependency ${dep.group}:${dep.name}:${dep.version} (${scope})")
                            }
                        }
                    }
                }
                addDeps('api', 'compile')
                addDeps('implementation', 'runtime')
            }
        }
    }
}
